[package]
name = "trend-media"
version = "0.1.0"
edition = "2024"
description = "Application-neutral media presentation primitives for TRend"
license = "Apache-2.0"
repository = "https://github.com/Toast-Knight/TRend"
keywords = ["terminal", "media", "image", "video", "preview"]
categories = ["multimedia"]
publish = false

[features]
webp = ["trend-animation/webp", "trend-image/webp"]
webm = ["trend-video/webm"]
linux-webm = ["webm", "trend-video/linux-webm"]
mkv = ["trend-video/mkv"]
linux-mkv = ["mkv", "trend-video/linux-mkv"]
linux-h264 = ["mkv", "trend-video/linux-h264"]
avi = ["trend-video/avi"]
mov = ["trend-video/mov"]

[dependencies]
trend = { path = "../.." }
trend-animation = { path = "../animation" }
trend-image = { path = "../image" }
trend-video = { path = "../video" }