[package]
name = "trend"
version = "0.1.0"
edition = "2024"
description = "Small, dependency-free terminal rendering core"
license = "Apache-2.0"
repository = "https://github.com/Toast-Knight/TRend"
homepage = "https://github.com/Toast-Knight/TRend"
keywords = ["terminal", "rendering", "ansi", "tui", "graphics"]
categories = ["command-line-interface", "rendering", "graphics"]
publish = false

[workspace]
members = [
	"adapters/3d",
	"adapters/animation",
	"adapters/image",
	"adapters/media",
	"adapters/term",
	"adapters/text",
	"adapters/video",
	"examples/external-renderer/host",
	"examples/external-renderer/renderer",
	"examples/first-render",
	"tools/python-tui-bridge",
	"tools/test-viewer",
	"tools/ui-lab",
]
default-members = ["."]
resolver = "3"

[lib]
name = "trend"
crate-type = ["rlib", "cdylib"]

[features]
default = []

[dependencies]

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"